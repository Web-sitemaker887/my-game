<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .scores {
      font-size: 18px;
      margin: 15px;
      line-height: 1.8;
    }

    #game {
      width: 90%;
      max-width: 700px;
      height: 450px;
      margin: 20px auto;
      background: #1f2937;
      border: 3px solid #374151;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
    }

    #target {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      font-size: 25px;
      font-weight: bold;
      position: absolute;
      cursor: pointer;
      transition: width 0.15s, height 0.15s, transform 0.1s;
    }

    #target:active {
      transform: scale(0.85);
    }
