<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .scores {
      font-size: 18px;
      margin: 15px;
      line-height: 1.8;
    }

    #game {
      width: 90%;
      max-width: 700px;
      height: 450px;
      margin: 20px auto;
      background: #1f2937;
      border: 3px solid #374151;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
    }

    #target {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      font-size: 25px;
      font-weight: bold;
      position: absolute;
      cursor: pointer;
    }

    #start {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #start:disabled {
      opacity: 0.5;
    }

    #message {
      font-size: 18px;
      min-height: 25px;
    }

    #feedback {
      font-size: 24px;
      font-weight: bold;
      height: 35px;
    }
  </style>
</head>

<body>

  <h1>🎮 My Game</h1>

  <div class="scores">
    Score: <span id="score">0</span>
    &nbsp; | &nbsp;
    Time: <span id="time">15</span>
    &nbsp; | &nbsp;
    🏆 High Score: <span id="highScore">0</span>
    <br>

    ⚡ Level: <span id="level">1</span>
    &nbsp; | &nbsp;
    ❤️ Lives: <span id="lives">3</span>
    &nbsp; | &nbsp;
    🔥 Combo: <span id="combo">0</span>
  </div>

  <button id="start">Start Game</button>

  <div id="game">
    <button id="target" hidden>+</button>
  </div>

  <div id="feedback"></div>

  <p id="message">Press Start to play!</p>

  <script>
    const game = document.getElementById("game");
    const target = document.getElementById("target");
    const start = document.getElementById("start");

    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const highScoreDisplay = document.getElementById("highScore");
    const levelDisplay = document.getElementById("level");
    const livesDisplay = document.getElementById("lives");
    const comboDisplay = document.getElementById("combo");

    const message = document.getElementById("message");
    const feedback = document.getElementById("feedback");

    let score = 0;
    let time = 15;
    let level = 1;
    let lives = 3;
    let combo = 0;

    let highScore = Number(localStorage.getItem("highScore")) || 0;

    let timer;
    let moveTimer;
    let playing = false;

    highScoreDisplay.textContent = highScore;

    function moveTarget() {
      const maxX = game.clientWidth - target.offsetWidth;
      const maxY = game.clientHeight - target.offsetHeight;

      const x = Math.random() * Math.max(0, maxX);
      const y = Math.random() * Math.max(0, maxY);

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function updateDifficulty() {
      level = Math.floor(score / 5) + 1;

      levelDisplay.textContent = level;

      const size = Math.max(25, 55 - (level - 1) * 5);

      target.style.width = size + "px";
      target.style.height = size + "px";

      clearInterval(moveTimer);

      const speed = Math.max(350, 1200 - (level - 1) * 120);

      moveTimer = setInterval(() => {
        if (playing) {
          moveTarget();
        }
      }, speed);
    }

    function showFeedback(text) {
      feedback.textContent = text;

      setTimeout(() => {
        feedback.textContent = "";
      }, 500);
    }

    function startGame() {
      clearInterval(timer);
      clearInterval(moveTimer);

      score = 0;
      time = 15;
      level = 1;
      lives = 3;
      combo = 0;

      playing = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = time;
      levelDisplay.textContent = level;
      livesDisplay.textContent = lives;
      comboDisplay.textContent = combo;

      target.style.width = "55px";
      target.style.height = "55px";

      feedback.textContent = "";
      message.textContent = "GO! 🎯";

      target.hidden = false;
      start.disabled = true;

      moveTarget();
      updateDifficulty();

      timer = setInterval(() => {
        time--;
        timeDisplay.textContent = time;

        if (time <= 0) {
          endGame("⏰ Time's up!");
        }
      }, 1000);
    }

    function endGame(reason) {
      clearInterval(timer);
      clearInterval(moveTimer);

      playing = false;

      target.hidden = true;
      start.disabled = false;

      if (score > highScore) {
        highScore = score;

        localStorage.setItem("highScore", highScore);
        highScoreDisplay.textContent = highScore;

        message.textContent =
          "🏆 NEW HIGH SCORE! " + score + " points!";
      } else {
        message.textContent =
          reason + " Final score: " + score;
      }

      feedback.textContent = "GAME OVER 🎮";
    }

    target.addEventListener("click", function(event) {
      event.stopPropagation();

      if (!playing) return;

      score++;
      combo++;

      scoreDisplay.textContent = score;
      comboDisplay.textContent = combo;

      if (combo >= 3) {
        showFeedback("🔥 COMBO x" + combo + "!");
      } else {
        showFeedback("+1 🎯");
      }

      updateDifficulty();
      moveTarget();
    });

    game.addEventListener("click", function() {
      if (!playing) return;

      lives--;
      combo = 0;

      livesDisplay.textContent = lives;
      comboDisplay.textContent = combo;

      showFeedback("💔 MISS!");

      if (lives <= 0) {
        endGame("💔 No lives left!");
      }
    });

    start.addEventListener("click", startGame);
  </script>

</body>
</html>
