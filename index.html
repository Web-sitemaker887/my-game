<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .scores {
      font-size: 20px;
      margin: 15px;
    }

    #game {
      width: 90%;
      max-width: 700px;
      height: 450px;
      margin: 20px auto;
      background: #1f2937;
      border: 3px solid #374151;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
    }

    #target {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      font-size: 25px;
      font-weight: bold;
      position: absolute;
      cursor: pointer;
    }

    #start {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #start:hover {
      background: #2563eb;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🎮 My Game</h1>

  <div class="scores">
    Score: <span id="score">0</span>
    &nbsp; | &nbsp;
    Time: <span id="time">15</span>
    &nbsp; | &nbsp;
    🏆 High Score: <span id="highScore">0</span>
  </div>

  <button id="start">Start Game</button>

  <div id="game">
    <button id="target" hidden>+</button>
  </div>

  <p id="message">Press Start to play!</p>

  <script>
    const game = document.getElementById("game");
    const target = document.getElementById("target");
    const start = document.getElementById("start");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const highScoreDisplay = document.getElementById("highScore");
    const message = document.getElementById("message");

    let score = 0;
    let time = 15;
    let timer;
    let playing = false;

    // Load saved high score
    let highScore = Number(localStorage.getItem("highScore")) || 0;
    highScoreDisplay.textContent = highScore;

    function moveTarget() {
      const maxX = game.clientWidth - target.offsetWidth;
      const maxY = game.clientHeight - target.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      clearInterval(timer);

      score = 0;
      time = 15;
      playing = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = time;
      message.textContent = "GO! 🎯";

      target.hidden = false;
      start.disabled = true;

      moveTarget();

      timer = setInterval(() => {
        time--;
        timeDisplay.textContent = time;

        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      playing = false;

      target.hidden = true;
      start.disabled = false;

      // Check for a new high score
      if (score > highScore) {
        highScore = score;

        localStorage.setItem("highScore", highScore);

        highScoreDisplay.textContent = highScore;

        message.textContent =
          "🏆 NEW HIGH SCORE! You scored " + score + "!";
      } else {
        message.textContent =
          "Game Over! You scored " + score + "!";
      }
    }

    target.addEventListener("click", () => {
      if (!playing) return;

      score++;
      scoreDisplay.textContent = score;

      moveTarget();
    });

    start.addEventListener("click", startGame);
  </script>

</body>
</html>
